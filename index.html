<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPS Sales Pipeline</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2d3150;--text:#e2e8f0;--muted:#7c8ba0;--accent:#4f8ef7;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--purple:#a855f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:15px;font-weight:700;}
.header-meta{color:var(--muted);font-size:11px;}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 16px;overflow-x:auto;}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{padding:16px 20px;max-width:1300px;margin:0 auto;}
.section{margin-bottom:28px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.section-title{font-size:14px;font-weight:700;}
.sbadge{font-size:11px;padding:2px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);}
.sbadge.committed{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:var(--purple);}
.sbadge.expected{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171;}
.sbadge.generated{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green);}
.sbadge.live{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.3);color:var(--accent);}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid rgba(45,49,80,.5);vertical-align:middle;}
.data-row{cursor:pointer;transition:background .1s;}
.data-row:hover{background:var(--surface2);}
.caret{color:var(--muted);font-size:9px;margin-right:4px;display:inline-block;transition:transform .15s;}
.caret.open{transform:rotate(90deg);color:var(--accent);}
.col-cust{width:20%;}
.col-lc{width:32px;white-space:nowrap;}
.col-stat{width:43%;}
.col-mod{width:13%;}
.col-rep{width:52px;white-space:nowrap;}
.col-stg{width:110px;white-space:nowrap;}
.lc-cell{color:var(--muted);font-size:10px;white-space:nowrap;}
.mod-cell{color:var(--muted);font-size:11px;}
.rep-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;white-space:nowrap;}
/* Stage chips */
.stage{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.s-q{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.s-m{background:rgba(79,142,247,.12);color:#7cb3ff;border:1px solid rgba(79,142,247,.3);}
.s-p{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
.s-o{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.s-r{background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.3);}
.tab.overdue-tab{color:#ef4444;}
.tab.overdue-tab.active{color:#ef4444;border-bottom-color:#ef4444;}
.sbadge.warm{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green);}
.sbadge.won{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#4ade80;}
.sbadge.lost{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171;}
.confirm-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:all .15s;}
.confirm-btn:hover{opacity:.85;}
.s-hot{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.hot-tag{display:inline-block;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);border-radius:8px;font-size:9px;font-weight:700;padding:1px 5px;margin-left:4px;vertical-align:middle;}
.sup-flag{font-size:11px;cursor:help;}
.exist-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;margin-left:4px;vertical-align:middle;}
.exist-y{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.exist-n{background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.3);}
.exist-p{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
/* Kaizen tab */
.tab.kaizen-tab{color:#f59e0b;}
.tab.kaizen-tab.active{color:#f59e0b;border-bottom-color:#f59e0b;}
.kaizen-wrap{max-width:640px;}
.kaizen-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
.kaizen-hint{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:14px;}
.kaizen-examples{color:var(--muted);font-size:11px;line-height:1.8;background:var(--surface2);border-radius:6px;padding:10px 14px;margin-bottom:14px;border-left:3px solid var(--border);}
.kaizen-examples span{display:block;}
.kaizen-ta{width:100%;height:130px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:12px;resize:vertical;font-family:inherit;line-height:1.6;transition:border-color .15s;}
.kaizen-ta:focus{outline:none;border-color:var(--amber);}
.kaizen-send{margin-top:10px;background:var(--amber);border:none;color:#000;padding:8px 22px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;transition:opacity .15s;}
.kaizen-send:hover{opacity:.85;}
.kaizen-ok{display:none;color:var(--green);font-size:11px;margin-top:8px;font-weight:600;}
/* Detail rows */
.detail-row td{padding:0;background:var(--bg);border-bottom:1px solid var(--border);}
.detail-card{padding:10px 14px 10px 20px;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
.ds{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.dl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.ds div{color:var(--text);font-size:11px;line-height:1.5;}
.ds strong{color:var(--muted);font-size:11px;}
.sup-card{color:#f59e0b;margin-top:6px;font-size:11px;}
.no-data{color:var(--muted);font-style:italic;font-size:11px;}
.hist-note{color:var(--muted);font-size:10px;margin-top:6px;font-style:italic;}
.int-entry{display:flex;flex-direction:column;gap:4px;}
.int-date{font-weight:700;color:var(--accent);font-size:11px;}
.int-type{color:var(--muted);font-size:10px;}
.int-stat{color:var(--text);font-size:11px;line-height:1.4;}
/* Empty/stats */
.empty-state{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;text-align:center;color:var(--muted);}
.empty-state p{font-size:12px;line-height:1.6;}
.stats-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:100px;flex:1;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:800;}
.sv-c{color:var(--purple);} .sv-e{color:#f87171;} .sv-g{color:var(--green);} .sv-l{color:var(--accent);} .sv-w{color:#4ade80;} .sv-lo{color:#f87171;}
/* Week tab */
.rep-group{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.week-hr{background:var(--surface2);padding:8px 16px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.week-row{display:grid;grid-template-columns:68px 110px 1fr 56px;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(45,49,80,.5);align-items:start;}
.week-row:last-child{border-bottom:none;}
.wd{font-size:11px;font-weight:700;white-space:nowrap;}
.wd.overdue{color:var(--red);} .wd.today{color:var(--green);} .wd.upcoming{color:var(--accent);}
.wc{font-weight:600;font-size:12px;}
.wa{color:var(--muted);font-size:11px;line-height:1.5;}
.wb{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;justify-self:end;white-space:nowrap;}
.od-note{color:var(--red);font-size:10px;margin-top:2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.stat-card{cursor:pointer;}
.stat-card.sec-active{border-color:var(--accent);background:rgba(79,142,247,.15);}
@media(max-width:700px){
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{min-width:560px;}
  .content{padding:10px 8px;}
  .stats-bar{gap:6px;}
  .stat-card{min-width:70px;padding:8px 10px;}
  .stat-value{font-size:16px;}
  .detail-grid{grid-template-columns:1fr;}
  .week-row{grid-template-columns:62px 68px 1fr 14px;gap:6px;}
  .wc{font-size:11px;font-weight:600;word-break:break-word;}
  .wa{font-size:11px;}
  /* force ALL text inside expanded cards to 11px — overrides every inline style */
  .detail-card{padding:6px 8px 6px 10px;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;max-width:100%;box-sizing:border-box;}
  .detail-card *{font-size:11px!important;line-height:1.4!important;overflow-wrap:break-word;word-wrap:break-word;word-break:break-word;}
  .detail-card .dl{font-size:9px!important;margin-bottom:5px;}
  .detail-card .dl span{font-size:9px!important;}
  .ds{padding:8px 9px;margin-bottom:7px;overflow:hidden;}
}
</style>
</head>

function isWarm(e){

function getWeek(){
  const t=new Date(TODAY+'T00:00:00');const d=t.getDay();
  const mon=new Date(t);mon.setDate(t.getDate()-(d===0?6:d-1));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const iso=x=>x.toISOString().split('T')[0];
  return{mon:iso(mon),sun:iso(sun)};
}

  const ro=['senthil','saravana','vijay','shanmuga'];
  function grp(arr){const g={};for(const e of arr){const r=normRep(e.rep)||'?';(g[r]=g[r]||[]).push(e);}return g;}

          +'<textarea id="un-'+e.id+'" placeholder="What happened? New status…" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;height:60px;resize:vertical"></textarea>'

    }).join('');
  }

    +'<button onclick="saveToken()" style="background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.4);color:#4ade80;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Save Token</button>'

function saveToken(){
  const v=(document.getElementById('tok-inp').value||'').trim();
  if(!v.startsWith('ghp_')){alert('Token should start with ghp_');return;}
  localStorage.setItem('saps_gt',v);
  document.getElementById('tok-banner').remove();
  document.getElementById('vu-status')?document.getElementById('vu-status').textContent='Token saved ✓':'';
}
async function pushGist(data){
  const tok=getToken();
  if(!tok){showTokenSetup();return false;}
  try{
    const r=await fetch('https://api.github.com/gists/'+_GID,{
      method:'PATCH',
      headers:{'Authorization':'token '+tok,'Content-Type':'application/json','User-Agent':'saps-web'},
      body:JSON.stringify({files:{'enquiries.json':{content:JSON.stringify(data,null,2)}}})
    });
    if(r.status===401){localStorage.removeItem('saps_gt');showTokenSetup();return false;}
    return r.ok;
  }catch(e){return false;}
}

function startMic(id){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Mic not supported in this browser — type directly in the box.');return;}
  if(_recs[id]){_recs[id].stop();return;}
  const r=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;
  _recs[id]=r;
  const btn=document.getElementById('mb-'+id);
  const ta=document.getElementById('un-'+id);
  const st=document.getElementById('us-'+id);
  btn.textContent='⏹ Stop';btn.style.background='rgba(239,68,68,.2)';btn.style.color='#f87171';
  st.textContent='Listening…';
  let base=ta.value;
  r.onresult=function(e){
    let fin='',int='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript+' ';
      else int+=e.results[i][0].transcript;
    }
    base+=fin;ta.value=base+int;
  };
  r.onend=function(){stopMic(id);};
  r.onerror=function(ev){st.textContent='Mic error: '+ev.error;stopMic(id);};
  r.start();
}
function stopMic(id){
  if(_recs[id]){try{_recs[id].stop();}catch(e){}delete _recs[id];}
  const btn=document.getElementById('mb-'+id);
  const st=document.getElementById('us-'+id);
  if(btn){btn.textContent='🎤';btn.style.background='';btn.style.color='';}
  if(st)st.textContent='';
}

async function saveUpdate(id){
  const notes=(document.getElementById('un-'+id).value||'').trim();
  const date=document.getElementById('udp-'+id).value;
  if(!notes){alert('Add a note first');return;}
  const d=window._d||EMBEDDED;
  let found=null;
  for(const cat of ['committedOrders','expectedThisMonth','liveOpportunities','opportunitiesGenerated']){
    const e=(d[cat]||[]).find(x=>x.id===id);
    if(e){found=e;break;}
  }
  if(!found){alert('Entry not found');return;}
  const st=document.getElementById('us-'+id);
  st.textContent='Saving…';
  found.status=notes;
  found.lastContact=TODAY;
  if(date)found.plannedFollowUp=date;
  if(!found.interactions)found.interactions=[];
  found.interactions.push({date:TODAY,type:'Telephonic Follow-up',notes:notes});
  d.lastUpdated=TODAY;
  window._d=d;
  const ok=await pushGist(d);
  if(ok){
    st.textContent='✓ Saved';
    setTimeout(()=>{render(d);},800);
  }else{
    st.textContent='Saved locally — push Gist manually';
    setTimeout(()=>{render(d);},800);
  }
}

    const live=data.liveOpportunities||[];
    const won=(data.ordersWon||[]).filter(e=>(e.closedDate||e.lastContact||'').startsWith(CUR_MONTH));
    const lost=(data.ordersLost||[]).filter(e=>(e.closedDate||e.lastContact||'').startsWith(CUR_MONTH));
    const warm=live.filter(isWarm);
    const warmQ=warm.filter(e=>QUOTED.includes(e.stage)).length;
    const genQ=gen.filter(e=>QUOTED.includes(e.stage)).length;
    const odCnt=[...comm,...expPlusHot,...live,...(data.opportunitiesGenerated||[])].filter(e=>e.plannedFollowUp&&e.plannedFollowUp<TODAY).length;
    el.innerHTML=
      '<div class="stats-bar">'+
      '<div class="stat-card" data-sec="committed" onclick="filterSec(\'committed\')"><div class="stat-label">Committed</div><div class="stat-value sv-c">'+comm.length+'</div></div>'+
      '<div class="stat-card" data-sec="expected" onclick="filterSec(\'expected\')"><div class="stat-label">Expected</div><div class="stat-value sv-e">'+expPlusHot.length+'</div></div>'+
      '<div class="stat-card" data-sec="won" onclick="filterSec(\'won\')"><div class="stat-label">Won</div><div class="stat-value sv-w">'+won.length+'</div></div>'+
      '<div class="stat-card" data-sec="lost" onclick="filterSec(\'lost\')"><div class="stat-label">Lost</div><div class="stat-value sv-lo">'+lost.length+'</div></div>'+
      '<div class="stat-card" data-sec="generated" onclick="filterSec(\'generated\')"><div class="stat-label">Generated</div><div class="stat-value sv-g">'+genQ+'</div></div>'+
      '<div class="stat-card" data-sec="warm" onclick="filterSec(\'warm\')"><div class="stat-label">Warm Opp.</div><div class="stat-value sv-l">'+warmQ+'</div></div>'+
      '<div class="stat-card" style="cursor:pointer" onclick="switchTab(\'week\')"><div class="stat-label">Check Quotes</div><div class="stat-value" style="color:#a78bfa">'+(warmQ+genQ)+'</div></div>'+
      (odCnt?'<div class="stat-card" style="border-color:rgba(239,68,68,.4)"><div class="stat-label" style="color:#f87171">Overdue</div><div class="stat-value" style="color:#f87171">'+odCnt+'</div></div>':'')+
      '</div>'+
      '<div class="section" data-sec="committed"><div class="section-header"><span class="section-title">🏆 Committed Orders</span><span class="sbadge committed">'+ml+' · '+comm.length+'</span></div>'+(comm.length?tbl(comm,'co',false):'<div class="empty-state"><p>No committed orders yet for '+ml+'.<br>Add entries manually each month.</p></div>')+'</div>'+
      '<div class="section" data-sec="expected"><div class="section-header"><span class="section-title">🔥 Expected This Month</span><span class="sbadge expected">'+expPlusHot.length+' accounts'+(hot.length?' · '+hot.length+' 🔥 hot':'')+'</span></div>'+tbl(expPlusHot,'eo',false)+'</div>'+
      '<div class="section" data-sec="won"><div class="section-header"><span class="section-title">✅ Won in '+ml+'</span><span class="sbadge won">'+won.length+'</span></div>'+(won.length?tbl(won,'wn',false):'<div class="empty-state"><p>No orders won yet this month.</p></div>')+'</div>'+
      '<div class="section" data-sec="lost"><div class="section-header"><span class="section-title">❌ Lost in '+ml+'</span><span class="sbadge lost">'+lost.length+'</span></div>'+(lost.length?tbl(lost,'ls',false):'<div class="empty-state"><p>No orders lost this month.</p></div>')+'</div>'+
      '<div class="section" data-sec="generated"><div class="section-header"><span class="section-title">✨ Generated in '+ml+'</span><span class="sbadge generated">'+genQ+' quoted · '+gen.length+' total</span></div>'+tbl(gen,'gm',true)+'</div>'+
      '<div class="section" data-sec="warm"><div class="section-header"><span class="section-title">🌡 Warm Opportunities</span><span class="sbadge warm">'+warmQ+' quoted · '+warm.length+' within 60 days'+(live.length-warm.length?' · '+(live.length-warm.length)+' longer-term':'')+'</span></div>'+tbl(warm,'lo',true)+'</div>';
    setTimeout(applySecF,0);return;
  }

  // SE tab
  const rk=cur;
  const comm=byRep(data.committedOrders||[],rk);
  const exp=byRep(data.expectedThisMonth||[],rk);
  const gen=curMonth(byRep(data.opportunitiesGenerated||[],rk));
  const hot=byRep(data.opportunitiesGenerated||[],rk).filter(e=>e.hotThisMonth);
  const expPlusHot=[...exp,...hot.filter(h=>!exp.find(e=>e.id===h.id))];
  const live=byRep(data.liveOpportunities||[],rk);
  const warm=live.filter(isWarm);
  const warmQ=warm.filter(e=>QUOTED.includes(e.stage)).length;
  const genQ=gen.filter(e=>QUOTED.includes(e.stage)).length;
  el.innerHTML=
    '<div class="stats-bar">'+
    '<div class="stat-card" data-sec="committed" onclick="filterSec(\'committed\')"><div class="stat-label">Committed</div><div class="stat-value sv-c">'+comm.length+'</div></div>'+
    '<div class="stat-card" data-sec="expected" onclick="filterSec(\'expected\')"><div class="stat-label">Expected</div><div class="stat-value sv-e">'+expPlusHot.length+'</div></div>'+
    '<div class="stat-card" data-sec="generated" onclick="filterSec(\'generated\')"><div class="stat-label">Generated</div><div class="stat-value sv-g">'+genQ+'</div></div>'+
    '<div class="stat-card" data-sec="warm" onclick="filterSec(\'warm\')"><div class="stat-label">Warm Opp.</div><div class="stat-value sv-l">'+warmQ+'</div></div>'+
    '</div>'+
    (comm.length?'<div class="section" data-sec="committed"><div class="section-header"><span class="section-title">🏆 Committed</span><span class="sbadge committed">'+comm.length+'</span></div>'+tbl(comm,'c-'+rk,false)+'</div>':'')+
    '<div class="section" data-sec="expected"><div class="section-header"><span class="section-title">🔥 Expected This Month</span><span class="sbadge expected">'+expPlusHot.length+'</span></div>'+(expPlusHot.length?tbl(expPlusHot,'e-'+rk,false):'<div class="empty-state"><p>No expected orders this month</p></div>')+'</div>'+
    '<div class="section" data-sec="generated"><div class="section-header"><span class="section-title">✨ Generated in '+ml+'</span><span class="sbadge generated">'+genQ+' quoted · '+gen.length+' total</span></div>'+(gen.length?tbl(gen,'g-'+rk,true):'<div class="empty-state"><p>No opportunities generated in '+ml+' yet</p></div>')+'</div>'+
    '<div class="section" data-sec="warm"><div class="section-header"><span class="section-title">🌡 Warm Opportunities</span><span class="sbadge warm">'+warmQ+' quoted · '+warm.length+' within 60 days'+(live.length-warm.length?' · '+(live.length-warm.length)+' longer-term':'')+'</span></div>'+(warm.length?tbl(warm,'l-'+rk,true):'<div class="empty-state"><p>No warm opportunities (all follow-ups beyond 60 days)</p></div>')+'</div>';
  setTimeout(applySecF,0);
}

const GIST_URL='https://gist.githubusercontent.com/amrit-saravanan/394ac598e92df4264f4caae197234e9c/raw/enquiries.json';
async function doRefresh(){
  document.getElementById('upd').textContent='Refreshing…';
  try{const r=await fetch(GIST_URL+'?_='+Date.now());if(r.ok){const d=await r.json();render(d);window._d=d;document.getElementById('upd').textContent='Updated: '+d.lastUpdated;return;}}catch(e){}
  render(EMBEDDED);document.getElementById('upd').textContent='Local data · '+EMBEDDED.lastUpdated;
}
renderTabs();render(EMBEDDED);
(async()=>{try{const r=await fetch(GIST_URL+'?_='+Date.now());if(r.ok){const d=await r.json();render(d);window._d=d;document.getElementById('upd').textContent='Last updated: '+d.lastUpdated;return;}}catch(e){}render(EMBEDDED);document.getElementById('upd').textContent='Last updated: '+EMBEDDED.lastUpdated;})();
</script>
