<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPS Intelligence</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2d3150;--text:#e2e8f0;--muted:#7c8ba0;--accent:#4f8ef7;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--purple:#a855f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:15px;font-weight:700;}
.header-meta{color:var(--muted);font-size:11px;}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;padding:0 16px;overflow-x:auto;}
.tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{padding:16px 20px;max-width:1300px;margin:0 auto;}
.section{margin-bottom:28px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.section-title{font-size:14px;font-weight:700;}
.sbadge{font-size:11px;padding:2px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);}
.sbadge.committed{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:var(--purple);}
.sbadge.expected{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171;}
.sbadge.generated{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:var(--green);}
.sbadge.live{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.3);color:var(--accent);}
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{background:var(--surface2);padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid rgba(45,49,80,.5);vertical-align:middle;}
.data-row{cursor:pointer;transition:background .1s;}
.data-row:hover{background:var(--surface2);}
.caret{color:var(--muted);font-size:9px;margin-right:4px;display:inline-block;transition:transform .15s;}
.caret.open{transform:rotate(90deg);color:var(--accent);}
.col-cust{width:22%;}
.col-lc{width:52px;white-space:nowrap;}
.col-stat{width:37%;}
.col-mod{width:13%;}
.col-rep{width:52px;white-space:nowrap;}
.col-stg{width:110px;white-space:nowrap;}
.lc-cell{color:var(--muted);font-size:11px;white-space:nowrap;}
.mod-cell{color:var(--muted);font-size:11px;}
.rep-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;white-space:nowrap;}
/* Stage chips */
.stage{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.s-q{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.s-m{background:rgba(79,142,247,.12);color:#7cb3ff;border:1px solid rgba(79,142,247,.3);}
.s-p{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
.s-o{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.s-hot{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.hot-tag{display:inline-block;background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);border-radius:8px;font-size:9px;font-weight:700;padding:1px 5px;margin-left:4px;vertical-align:middle;}
.sup-flag{font-size:11px;cursor:help;}
.exist-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;margin-left:4px;vertical-align:middle;}
.exist-y{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3);}
.exist-n{background:rgba(168,85,247,.12);color:#c084fc;border:1px solid rgba(168,85,247,.3);}
.exist-p{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.3);}
/* Kaizen tab */
.tab.kaizen-tab{color:#f59e0b;}
.tab.kaizen-tab.active{color:#f59e0b;border-bottom-color:#f59e0b;}
.kaizen-wrap{max-width:640px;}
.kaizen-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px;}
.kaizen-hint{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:14px;}
.kaizen-examples{color:var(--muted);font-size:11px;line-height:1.8;background:var(--surface2);border-radius:6px;padding:10px 14px;margin-bottom:14px;border-left:3px solid var(--border);}
.kaizen-examples span{display:block;}
.kaizen-ta{width:100%;height:130px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;color:var(--text);font-size:12px;resize:vertical;font-family:inherit;line-height:1.6;transition:border-color .15s;}
.kaizen-ta:focus{outline:none;border-color:var(--amber);}
.kaizen-send{margin-top:10px;background:var(--amber);border:none;color:#000;padding:8px 22px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;transition:opacity .15s;}
.kaizen-send:hover{opacity:.85;}
.kaizen-ok{display:none;color:var(--green);font-size:11px;margin-top:8px;font-weight:600;}
/* Detail rows */
.detail-row td{padding:0;background:var(--bg);border-bottom:1px solid var(--border);}
.detail-card{padding:14px 20px 14px 32px;}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
.ds{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.dl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.ds div{color:var(--text);font-size:12px;line-height:1.6;}
.ds strong{color:var(--muted);font-size:11px;}
.sup-card{color:#f59e0b;margin-top:6px;font-size:11px;}
.no-data{color:var(--muted);font-style:italic;font-size:11px;}
.hist-note{color:var(--muted);font-size:10px;margin-top:6px;font-style:italic;}
.int-entry{display:flex;flex-direction:column;gap:4px;}
.int-date{font-weight:700;color:var(--accent);font-size:12px;}
.int-type{color:var(--muted);font-size:11px;}
.int-stat{color:var(--text);font-size:12px;line-height:1.5;}
/* Empty/stats */
.empty-state{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:28px;text-align:center;color:var(--muted);}
.empty-state p{font-size:12px;line-height:1.6;}
.stats-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:100px;flex:1;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.stat-value{font-size:20px;font-weight:800;}
.sv-c{color:var(--purple);} .sv-e{color:#f87171;} .sv-g{color:var(--green);} .sv-l{color:var(--accent);} .sv-w{color:#4ade80;} .sv-lo{color:#f87171;}
/* Week tab */
.rep-group{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.week-hr{background:var(--surface2);padding:8px 16px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.week-row{display:grid;grid-template-columns:86px 155px 1fr 64px;gap:12px;padding:9px 16px;border-bottom:1px solid rgba(45,49,80,.5);align-items:start;}
.week-row:last-child{border-bottom:none;}
.wd{font-size:11px;font-weight:700;white-space:nowrap;}
.wd.overdue{color:var(--red);} .wd.today{color:var(--green);} .wd.upcoming{color:var(--accent);}
.wc{font-weight:600;font-size:12px;}
.wa{color:var(--muted);font-size:11px;line-height:1.5;}
.wb{font-size:10px;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 6px;justify-self:end;white-space:nowrap;}
.od-note{color:var(--red);font-size:10px;margin-top:2px;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

  const ex=e.customerProfile?.isExisting;const existTag=ex===true?' <span class="exist-badge exist-y">Existing</span>':ex===false?' <span class="exist-badge exist-n">New</span>':ex==='pending'?' <span class="exist-badge exist-p">? Confirm</span>':'';
  const st=(e.status||'').length>78?(e.status||'').substring(0,78)+'…':(e.status||'—');
  return'<tr class="data-row" onclick="toggleRow(\''+id+'\')"><td class="col-cust"><span class="caret" id="c-'+id+'">▶</span> '+e.customer+sup+hot+existTag+'</td><td class="col-lc lc-cell">'+lc+'</td><td class="col-stat">'+st+'</td><td class="col-mod mod-cell">'+model+'</td><td class="col-rep"><span class="rep-badge">'+(RL[rk]||e.rep)+'</span></td><td class="col-stg">'+stageChip(e.stage)+'</td></tr><tr class="detail-row" id="'+id+'" style="display:none"><td colspan="6">'+detailCard(e,showCR)+'</td></tr>';
}

function detailCard(e,showCR){
  const rk=normRep(e.rep);
  const vi=(e.visitType||'').toLowerCase().includes('in-person')?'🏢':(e.visitType?'📞':'📋');
  const vl=e.visitType||'Interaction';
  const pf=e.plannedFollowUp?fmtD(e.plannedFollowUp):'—';
  const af=e.actualFollowUp?'<div><strong>Executed:</strong> '+fmtD(e.actualFollowUp)+'</div>':'';
  const ct=e.contact?'<div><strong>Contact:</strong> '+e.contact+'</div>':'';
  const loc=e.location?'<div><strong>Location:</strong> '+e.location+'</div>':'';

  // Our side actions
  const ourSide=e.pendingActions?.ourSide;
  const ourHtml=ourSide
    ?'<div>'+ourSide+'</div>'
    :(e.supportRequired?'<div class="sup-card">⚠️ Support / visit from office needed</div>':'<div class="no-data">None recorded</div>');

  // Customer side blockers
  const custSide=e.pendingActions?.customerSide;
  const custHtml=custSide?'<div>'+custSide+'</div>':'<div class="no-data">None recorded</div>';

  // Compressor room
  let crHtml='';
  if(showCR){
    const cr=e.compressorRoom;
    if(cr&&(cr.brand||cr.size||cr.loadPattern)){
      crHtml='<div class="ds"><div class="dl">🏭 Compressor Room</div>'+(cr.brand?'<div><strong>Brand:</strong> '+cr.brand+'</div>':'')+(cr.size?'<div><strong>Size:</strong> '+cr.size+'</div>':'')+(cr.loadPattern?'<div><strong>Load Pattern:</strong> '+cr.loadPattern+'</div>':'')+(cr.notes?'<div><strong>Notes:</strong> '+cr.notes+'</div>':'')+'</div>';
    } else {
      crHtml='<div class="ds"><div class="dl">🏭 Compressor Room</div><div class="no-data">Not recorded — SE to capture on next visit</div><div class="no-data" style="margin-top:4px">Brand · Size · Load pattern</div></div>';
    }
  }

  // Customer profile
  const cp=e.customerProfile;
  let cpHtml='';
  if(cp&&(cp.products||cp.market||cp.keyProblems)){
    cpHtml='<div class="ds"><div class="dl">🏭 Customer Profile</div>'+(cp.products?'<div><strong>Products:</strong> '+cp.products+'</div>':'')+(cp.market?'<div><strong>Market:</strong> '+cp.market+'</div>':'')+(cp.keyProblems?'<div><strong>Key Problems:</strong> '+cp.keyProblems+'</div>':'')+(cp.otherEquipment?'<div><strong>Other Equipment:</strong> '+cp.otherEquipment+'</div>':'')+'</div>';
  }

  return'<div class="detail-card"><div class="detail-grid"><div class="ds"><div class="dl">📅 Interaction Log</div><div class="int-entry"><span class="int-date">'+fmtD(e.lastContact)+'</span><span class="int-type">'+vi+' '+vl+'</span><span class="int-stat">'+(e.status||'—')+'</span></div><div class="hist-note">Future interactions appended here each week</div></div><div class="ds"><div class="dl">🔧 Our Actions Pending</div>'+ourHtml+'<div style="margin-top:12px" class="dl">👤 Customer-Side Blockers</div>'+custHtml+'</div><div class="ds"><div class="dl">📌 Follow-up</div><div><strong>Next:</strong> '+pf+'</div>'+af+ct+loc+'<div><strong>Rep:</strong> '+(RF[rk]||e.rep)+' · '+(e.territory||'')+'</div></div>'+crHtml+cpHtml+'</div></div>';
}

function toggleRow(id){const el=document.getElementById(id);const c=document.getElementById('c-'+id);const open=el.style.display!=='none';el.style.display=open?'none':'table-row';if(c)c.className=open?'caret':'caret open';}

function tbl(items,pfx,showCR){
  if(!items.length)return'<div class="empty-state"><p>No entries</p></div>';
  return'<div class="tbl-wrap"><table><thead><tr><th class="col-cust">Customer</th><th class="col-lc">Last Contact</th><th class="col-stat">Status / Next Action</th><th class="col-mod">Model</th><th class="col-rep">Rep</th><th class="col-stg">Stage</th></tr></thead><tbody>'+items.map(e=>dataRow(e,pfx,showCR)).join('')+'</tbody></table></div>';
}

function byRep(arr,rk){return arr.filter(e=>normRep(e.rep)===rk);}
function curMonth(arr){return arr.filter(e=>(e.lastContact||'').startsWith(CUR_MONTH));}

// Week tab
function getWeek(){
  const t=new Date(TODAY+'T00:00:00');const d=t.getDay();
  const mon=new Date(t);mon.setDate(t.getDate()-(d===0?6:d-1));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const iso=x=>x.toISOString().split('T')[0];
  return{mon:iso(mon),sun:iso(sun)};
}

function buildWeek(data){
  const{mon,sun}=getWeek();
  const ago=new Date(TODAY+'T00:00:00');ago.setDate(ago.getDate()-10);
  const tenAgo=ago.toISOString().split('T')[0];
  const all=[...data.committedOrders,...data.expectedThisMonth,...data.liveOpportunities,...data.opportunitiesGenerated];
  const wk=[],od=[];
  for(const e of all){const pf=e.plannedFollowUp;if(!pf)continue;if(pf>=mon&&pf<=sun)wk.push(e);else if(pf<mon&&pf>=tenAgo)od.push(e);}
  const ro=['senthil','saravana','vijay','shanmuga'];
  function grp(arr){const g={};for(const e of arr){const r=normRep(e.rep)||'?';(g[r]=g[r]||[]).push(e);}return g;}
  function renderGrp(arr,isOd){
    const g=grp(arr);
    return ro.filter(r=>g[r]?.length).map(r=>{
      const rows=g[r].map(e=>{const pf=e.plannedFollowUp;let cls='upcoming',lbl=fmtD(pf);if(pf===TODAY){cls='today';lbl='Today';}else if(pf<TODAY){cls='overdue';}return'<div class="week-row"><div class="wd '+cls+'">'+lbl+(isOd?'<div class="od-note">Overdue</div>':'')+'</div><div class="wc">'+e.customer+'</div><div class="wa">'+((e.status||'').substring(0,90))+'</div><span class="wb">'+(RL[r]||r)+'</span></div>';}).join('');
      return'<div class="rep-group"><div class="week-hr">'+(RF[r]||r)+'</div>'+rows+'</div>';
    }).join('');
  }
  const wkLbl=fmtD(mon)+' – '+fmtD(sun);
  let h='<div class="section"><div class="section-header"><span class="section-title">📅 This Week\'s Follow-ups</span><span class="sbadge">'+wkLbl+'</span></div>';
  h+=wk.length?renderGrp(wk,false):'<div class="empty-state"><p>No follow-ups this week</p></div>';
  h+='</div>';
  if(od.length){h+='<div class="section"><div class="section-header"><span class="section-title">🔴 Overdue</span><span class="sbadge" style="background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171">Ask SE what happened</span></div>'+renderGrp(od,true)+'</div>';}
  return h;
}

const TABS=[
  {k:'dashboard',l:'📊 Dashboard'},
  {k:'week',l:'📅 This Week'},
  {k:'senthil',l:'Senthil'},
  {k:'saravana',l:'TSK'},
  {k:'vijay',l:'VK'},
  {k:'shanmuga',l:'GS'},
  {k:'kaizen',l:'🔄 Kaizen',cls:'kaizen-tab'}
];
let cur='dashboard';

function renderTabs(){document.getElementById('tabs-row').innerHTML=TABS.map(t=>'<div class="tab'+(cur===t.k?' active':'')+' '+(t.cls||'')+'" onclick="sw(\''+t.k+'\')">'+t.l+'</div>').join('');}
function sw(k){cur=k;_ri=0;renderTabs();render(window._d||EMBEDDED);}

function buildKaizen(){
  return `<div class="kaizen-wrap">
    <div class="section-header" style="margin-bottom:16px">
      <span class="section-title">🔄 Kaizen — Continuous Improvement</span>
    </div>
    <div class="kaizen-box">
      <div class="dl" style="margin-bottom:10px">What to log here</div>
      <div class="kaizen-hint">Anything you notice while using the tracker each day. No need to be formal — just type it and send.</div>
      <div class="kaizen-examples">
        <span>→ "LO-015 stage should be price finalised not quoted"</span>
        <span>→ "VK's Cosmo Labels — follow up date passed, check what happened"</span>
        <span>→ "Need to see territory in the main table"</span>
        <span>→ "Senthil hasn't updated 3 customers in 2 weeks"</span>
        <span>→ "Can we add a column for number of visits?"</span>
      </div>
      <textarea id="kaizen-input" class="kaizen-ta" placeholder="Type your observation here…"></textarea>
      <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
        <button class="kaizen-send" onclick="sendKaizen()">Send to Claude →</button>
        <div id="kaizen-ok" class="kaizen-ok">✓ Sent — Claude will process this</div>
      </div>
    </div>
    <div class="kaizen-box" style="border-color:rgba(245,158,11,.2)">
      <div class="dl" style="margin-bottom:10px;color:var(--amber)">How this works</div>
      <div style="color:var(--muted);font-size:12px;line-height:1.8">
        <div>1. Type any observation, correction, or improvement idea above</div>
        <div>2. Click <strong style="color:var(--text)">Send to Claude</strong> — it goes directly to the Cowork chat</div>
        <div>3. Claude processes it and updates the tracker + data file</div>
        <div>4. Refresh to see the changes</div>
      </div>
    </div>
  </div>`;
}
function sendKaizen(){
  const txt=document.getElementById('kaizen-input').value.trim();
  if(!txt)return;
  if(typeof sendPrompt==='function'){
    sendPrompt('📋 Kaizen: '+txt);
    document.getElementById('kaizen-ok').style.display='block';
    document.getElementById('kaizen-input').value='';
    setTimeout(()=>{const el=document.getElementById('kaizen-ok');if(el)el.style.display='none';},4000);
  }
}
function render(data){
  window._d=data;
  const el=document.getElementById('main');
  if(cur==='kaizen'){el.innerHTML=buildKaizen();return;}
  if(cur==='week'){el.innerHTML=buildWeek(data);return;}
  const ml=MONTHS[+CUR_MONTH.split('-')[1]-1]+' '+CUR_MONTH.split('-')[0];

  if(cur==='dashboard'){
    const comm=data.committedOrders||[];
    const exp=data.expectedThisMonth||[];
    const gen=curMonth(data.opportunitiesGenerated||[]);
    const hot=(data.opportunitiesGenerated||[]).filter(e=>e.hotThisMonth);
    const expPlusHot=[...exp,...hot.filter(h=>!exp.find(e=>e.id===h.id))];
    const live=data.liveOpportunities||[];
    const won=(data.ordersWon||[]).filter(e=>(e.closedDate||e.lastContact||'').startsWith(CUR_MONTH));
    const lost=(data.ordersLost||[]).filter(e=>(e.closedDate||e.lastContact||'').startsWith(CUR_MONTH));
    el.innerHTML=
      '<div class="stats-bar">'+
      '<div class="stat-card"><div class="stat-label">Committed</div><div class="stat-value sv-c">'+comm.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Expected (May)</div><div class="stat-value sv-e">'+expPlusHot.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Generated (May)</div><div class="stat-value sv-g">'+gen.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Live Pipeline</div><div class="stat-value sv-l">'+live.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Won (May)</div><div class="stat-value sv-w">'+won.length+'</div></div>'+
      '<div class="stat-card"><div class="stat-label">Lost (May)</div><div class="stat-value sv-lo">'+lost.length+'</div></div>'+
      '</div>'+
      '<div class="section"><div class="section-header"><span class="section-title">🏆 Committed Orders</span><span class="sbadge committed">'+ml+' · '+comm.length+'</span></div>'+(comm.length?tbl(comm,'co',false):'<div class="empty-state"><p>No committed orders yet for '+ml+'.<br>Add entries manually each month.</p></div>')+'</div>'+
      '<div class="section"><div class="section-header"><span class="section-title">🔥 Expected This Month</span><span class="sbadge expected">'+expPlusHot.length+' accounts'+(hot.length?' · '+hot.length+' 🔥 hot from generated':'')+'</span></div>'+tbl(expPlusHot,'eo',false)+'</div>'+
      '<div class="section"><div class="section-header"><span class="section-title">✨ Generated in '+ml+'</span><span class="sbadge generated">'+gen.length+' new</span></div>'+tbl(gen,'gm',true)+'</div>'+
      '<div class="section"><div class="section-header"><span class="section-title">📋 Live Pipeline</span><span class="sbadge live">'+live.length+'</span></div>'+tbl(live,'lo',true)+'</div>';
    return;
  }

  // SE tab
  const rk=cur;
  const comm=byRep(data.committedOrders||[],rk);
  const exp=byRep(data.expectedThisMonth||[],rk);
  const gen=curMonth(byRep(data.opportunitiesGenerated||[],rk));
  const hot=byRep(data.opportunitiesGenerated||[],rk).filter(e=>e.hotThisMonth);
  const expPlusHot=[...exp,...hot.filter(h=>!exp.find(e=>e.id===h.id))];
  const live=byRep(data.liveOpportunities||[],rk);
  el.innerHTML=
    '<div class="stats-bar">'+
    '<div class="stat-card"><div class="stat-label">Committed</div><div class="stat-value sv-c">'+comm.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Expected</div><div class="stat-value sv-e">'+expPlusHot.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Generated (May)</div><div class="stat-value sv-g">'+gen.length+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">Live</div><div class="stat-value sv-l">'+live.length+'</div></div>'+
    '</div>'+
    (comm.length?'<div class="section"><div class="section-header"><span class="section-title">🏆 Committed</span><span class="sbadge committed">'+comm.length+'</span></div>'+tbl(comm,'c-'+rk,false)+'</div>':'')+
    '<div class="section"><div class="section-header"><span class="section-title">🔥 Expected This Month</span><span class="sbadge expected">'+expPlusHot.length+'</span></div>'+(expPlusHot.length?tbl(expPlusHot,'e-'+rk,false):'<div class="empty-state"><p>No expected orders this month</p></div>')+'</div>'+
    '<div class="section"><div class="section-header"><span class="section-title">✨ Generated in May</span><span class="sbadge generated">'+gen.length+'</span></div>'+(gen.length?tbl(gen,'g-'+rk,true):'<div class="empty-state"><p>No opportunities generated in May yet</p></div>')+'</div>'+
    '<div class="section"><div class="section-header"><span class="section-title">📋 Live Pipeline</span><span class="sbadge live">'+live.length+'</span></div>'+(live.length?tbl(live,'l-'+rk,true):'<div class="empty-state"><p>No live opportunities</p></div>')+'</div>';
}

const GIST_URL='https://gist.githubusercontent.com/amrit-saravanan/790e68dcdd34284fde0270c8e4633a1b/raw/enquiries.json';
async function doRefresh(){
  document.getElementById('upd').textContent='Refreshing…';
  try{const r=await fetch(GIST_URL+'?_='+Date.now());if(r.ok){const d=await r.json();render(d);window._d=d;document.getElementById('upd').textContent='Updated: '+d.lastUpdated;return;}}catch(e){}
  render(EMBEDDED);document.getElementById('upd').textContent='Local data · '+EMBEDDED.lastUpdated;
}
renderTabs();
(async()=>{try{const r=await fetch(GIST_URL+'?_='+Date.now());if(r.ok){const d=await r.json();render(d);window._d=d;document.getElementById('upd').textContent='Last updated: '+d.lastUpdated;return;}}catch(e){}render(EMBEDDED);document.getElementById('upd').textContent='Last updated: '+EMBEDDED.lastUpdated;})();
</script>
